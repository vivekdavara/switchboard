name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Rate limits, the cache and usage totals (day 3) are tested against a real Redis. Set, the variable makes
      # those tests fail rather than skip when Redis doesn't answer, so the job can't pass by skipping them.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      SWITCHBOARD_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Cross-compile
        # Windows, Linux on arm64, macOS: a Unix-only call (syscall.Kill) once broke the Windows build unnoticed.
        run: make cross
      - name: Test
        # Below the job timeout, so a hung test is named in the log instead of the job just being killed.
        run: go test -race -count=1 -timeout 3m ./...
      - name: Benchmarks run
        # Not a measurement (a shared runner is noisy): only that every benchmark still runs. README has the numbers.
        run: make bench-smoke

  smoke:
    # The real binaries on their real ports: scripts/demo.sh starts two mock providers and the gateway, checks the
    # answers with curl and with the official OpenAI Python SDK, and fails if any differs. Day 3's part runs against
    # this Redis, on the port the demo uses here (6382).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:8
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The OpenAI SDK
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r scripts/requirements-sdk.txt
      - name: Demo
        env:
          # Set, so a broken SDK install fails the job instead of skipping the SDK's checks.
          SDK_PYTHON: .venv/bin/python
        run: scripts/demo.sh
      - name: Logs
        if: failure()
        run: tail -n 50 run/*.log
