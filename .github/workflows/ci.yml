name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        # Below the job timeout, so a hung test is named in the log instead of the job just being killed.
        run: go test -race -count=1 -timeout 3m ./...

  smoke:
    # The real binaries on their real ports: scripts/demo.sh starts two mock providers and the gateway, checks eight
    # requests' answers, and fails if any differs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Demo
        run: scripts/demo.sh
      - name: Logs
        if: failure()
        run: tail -n 50 run/*.log
